plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    // Spotless drives the lint/format step (palantir-java-format ~= prettier for Java).
    id 'com.diffplug.spotless' version '6.25.0'
}

version = project.modVersion
group = project.modGroup
base.archivesName = 'lumenwilds'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Needed for the JUnit test dependencies below.
    mavenCentral()
}

neoForge {
    version = project.neoForgeVersion

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Data generation run: ./gradlew runData
        // Writes to src/generated/resources (git-ignored) using src/main/resources as the
        // "existing" reference, so datagen never clobbers the hand-authored placeholder assets.
        data {
            data()
            programArguments.addAll(
                '--mod', project.modId,
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        lumenwilds {
            sourceSet sourceSets.main
        }
    }

    // JUnit-based unit tests run with the NeoForge/Minecraft runtime on the test classpath so
    // tests can touch real platform types without standing up the game client. No tests yet,
    // but the harness is wired up for Phase 2+ (see docs/IMPLEMENTATION_PLAN.md).
    unitTest {
        enable()
        testedMod = mods.lumenwilds
    }
}

// NOTE: src/generated/resources (datagen output) is deliberately NOT added to the resource path.
// The hand-authored placeholder assets under src/main/resources are authoritative so the mod loads
// from a clean `build` with nothing generated/committed. `runData` writes to src/generated/resources
// (git-ignored) purely as a regeneration/diff aid; copy anything you want to keep into src/main.

dependencies {
    // --- Test-only: JUnit 5 --------------------------------------------------
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Formatting / lint (palantir-java-format, 4-space / 120-col — "prettier for Java"). Folded into the
// build: spotlessApply runs automatically before compilation, so `gradlew build` formats + compiles
// + tests in one go. spotlessCheck runs as part of `check` (and therefore `build`).
spotless {
    java {
        target 'src/main/**/*.java', 'src/test/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('compileJava') {
    dependsOn 'spotlessApply'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'The Lumenwilds',
            'Specification-Vendor'  : 'lumenwilds',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'lumenwilds'
        ])
    }
}
