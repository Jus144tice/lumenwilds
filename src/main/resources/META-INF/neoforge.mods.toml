## The Lumenwilds — NeoForge mod metadata (Minecraft 1.21.1)

modLoader = "javafml"
loaderVersion = "[4,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/Jus144tice/lumenwilds/issues"

# Mixins (Phase 7d) — gives the Lumenwilds its own half-rate day clock (see mixin/ + world/time/).
[[mixins]]
config = "lumenwilds.mixins.json"

[[mods]]
modId = "lumenwilds"
version = "${file.jarVersion}"
displayName = "The Lumenwilds"
authors = "Jus144tice"
# Adds the Glowwood Boat.Type via NeoForge's enum extension (see registry/ModBoatTypes).
enumExtensions = "META-INF/enumextensions.json"
description = '''
The Lumenwilds is an alien, bioluminescent custom dimension reached through a player-built portal whose
frame is Lumenbound Stone (NOT vanilla lodestone), lit with the Lumen Striker. Explore seven glowing biomes
under the giant moon Veyra in low gravity: native fauna, glowing flora and wood, Lumenwater, status effects
and brewing, the ruined Vestige Cities of the vanished Lumenwrights (resonance tech, gravity liftshafts,
abandoned mines), and Lumenwater fishing with rare effect-enchantment "spell books". Install Patchouli for
the in-game guide.
'''

# --- NeoForge (required) ---
[[dependencies.lumenwilds]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

# --- Minecraft (required) ---
[[dependencies.lumenwilds]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# --- Patchouli (optional) — the in-game guidebook (v1.1h). The mod loads + plays without it; the guide
# just can't be opened. No Patchouli Java API is used (the book is datapack JSON + a mod_loaded-gated craft).
[[dependencies.lumenwilds]]
modId = "patchouli"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# --- Create (optional, ordering only) — v1.1.4 boot-crash fix. Create initializes its advancements during
# the TRIGGER_TYPES registry phase (Create#onRegister → AllAdvancements), which reads its own fluid buckets
# registered in the ITEM phase. In a large modpack, v1.1.3's added registrations shifted the mod-load order
# enough to surface a latent ordering crash inside Create (NPE: unbound create:chocolate_bucket). Forcing
# Lumenwilds to load AFTER Create makes Create register first in every phase, restoring a known-good order.
# Optional: if Create is absent this is a no-op.
[[dependencies.lumenwilds]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
